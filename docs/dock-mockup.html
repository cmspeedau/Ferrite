<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satisfactory Dock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #08090b;
      color: #eceff3;
      height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: end center;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    .dock {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 14px 18px 18px 18px;
      margin-bottom: 16px;
      background:
        linear-gradient(180deg, rgba(40,44,52,0.85) 0%, rgba(24,27,33,0.9) 50%, rgba(17,19,24,0.95) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      backdrop-filter: blur(22px);
      box-shadow:
        0 12px 30px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .dock::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 8px;
      right: 8px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      pointer-events: none;
    }

    .dock-btn {
      position: relative;
      width: 54px; height: 54px;
      background: transparent;
      border: none;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 28px;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.15s;
      color: #eceff3;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    .dock-btn::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff6b00;
      opacity: 0;
      box-shadow: 0 0 8px rgba(255, 107, 0, 0.4);
      transition: opacity 0.15s;
    }

    .dock-btn:hover {
      transform: translateY(-14px) scale(1.35);
      margin: 0 10px;
    }

    .dock-btn.active::after { opacity: 1; }

    .dock-hex {
      position: relative;
      width: 56px; height: 56px;
      background: linear-gradient(180deg, #ff8533 0%, #ff6b00 50%, #cc5500 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: grid;
      place-items: center;
      font-size: 26px;
      color: #000;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.15s;
      filter: drop-shadow(0 4px 10px rgba(255, 107, 0, 0.4));
      margin-bottom: 2px;
    }

    .dock-hex:hover {
      transform: translateY(-16px) scale(1.4);
      margin: 0 12px;
      filter: drop-shadow(0 8px 20px rgba(255, 107, 0, 0.4));
    }

    .dock-divider {
      width: 1px;
      height: 42px;
      background: rgba(255,255,255,0.08);
      margin: 0 6px 6px 6px;
      border-radius: 1px;
    }

    .start-menu {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      width: 460px;
      background: rgba(17, 19, 24, 0.92);
      border: 1px solid #2a2f38;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 500;
    }

    .start-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .start-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .start-header h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ff6b00;
    }

    .start-search {
      width: 100%;
      padding: 10px 14px;
      background: #181b21;
      border: 1px solid #2a2f38;
      border-radius: 8px;
      color: #eceff3;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .start-search:focus { outline: none; border-color: #ff6b00; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      background: #181b21;
      border: 1px solid #2a2f38;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .app-tile:hover {
      border-color: #ff6b00;
      background: #22262d;
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.4);
    }

    .app-tile-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      background: #111318;
      border: 1px solid #2a2f38;
    }

    .app-tile span { font-size: 11px; color: #eceff3; }

    @media (max-width: 540px) {
      .start-menu { width: 92vw; }
      .dock-btn { width: 44px; height: 44px; font-size: 22px; }
      .dock-hex { width: 46px; height: 46px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="start-menu" id="startMenu">
    <div class="start-header">
      <h3>All Applications</h3>
    </div>
    <input type="text" class="start-search" placeholder="Search applications, files, commands..." />
    <div class="app-grid">
      <div class="app-tile"><div class="app-tile-icon">📁</div><span>Explorer</span></div>
      <div class="app-tile"><div class="app-tile-icon">🌐</div><span>Browser</span></div>
      <div class="app-tile"><div class="app-tile-icon">💻</div><span>Editor</span></div>
      <div class="app-tile"><div class="app-tile-icon">⌨️</div><span>Terminal</span></div>
      <div class="app-tile"><div class="app-tile-icon">🎵</div><span>Music</span></div>
      <div class="app-tile"><div class="app-tile-icon">✉️</div><span>Mail</span></div>
      <div class="app-tile"><div class="app-tile-icon">⚙️</div><span>Settings</span></div>
      <div class="app-tile"><div class="app-tile-icon">🖼️</div><span>Photos</span></div>
      <div class="app-tile"><div class="app-tile-icon">🎮</div><span>Steam</span></div>
      <div class="app-tile"><div class="app-tile-icon">🗒️</div><span>Notes</span></div>
      <div class="app-tile"><div class="app-tile-icon">📅</div><span>Calendar</span></div>
      <div class="app-tile"><div class="app-tile-icon">🧮</div><span>Calculator</span></div>
      <div class="app-tile"><div class="app-tile-icon">🎨</div><span>Design</span></div>
      <div class="app-tile"><div class="app-tile-icon">📹</div><span>Camera</span></div>
      <div class="app-tile"><div class="app-tile-icon">🔒</div><span>Security</span></div>
      <div class="app-tile"><div class="app-tile-icon">🗑️</div><span>Recycle</span></div>
    </div>
  </div>

  <div class="dock">
    <div class="dock-btn">🔍</div>
    <div class="dock-btn active">📁</div>
    <div class="dock-btn">🌐</div>
    <div class="dock-btn">💻</div>
    <div class="dock-hex" id="startBtn">🏭</div>
    <div class="dock-btn">🎬</div>
    <div class="dock-btn">🎵</div>
    <div class="dock-btn">✉️</div>
    <div class="dock-btn">⚙️</div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const startMenu = document.getElementById('startMenu');

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startMenu.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!startMenu.contains(e.target) && e.target !== startBtn) {
        startMenu.classList.remove('open');
      }
    });

    document.querySelectorAll('.dock-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
