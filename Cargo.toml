[package]
name = "ferrite"
version = "0.0.1"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
backtrace = "0.3"
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git"}
ron = "0.8"
serde = { version = "1", features = ["derive"] }
xdg = "^2.1"
once_cell = "1.17"
indexmap = { version = "1.9", features = ["serde"] }
colors-transform = "0.2"
egui = "0.23"
egui_extras = { version = "0.23", features = ["image", "svg"] }
image = { version = "0.24", default-features = false, features = ["png"] }
egui_plot = { version = "0.23", optional = true }
clap = { version = "4.5", features = ["derive"] }

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "backend_session_libseat",
    "backend_drm",
    "renderer_multi",
    "renderer_glow",
    "backend_gbm",
    "backend_udev",
    "backend_egl",
    "backend_libinput",
    "use_system_lib",
]

[dependencies.smithay-egui]
git = "https://github.com/Smithay/smithay-egui.git"

[features]
default = ["debug", "xwayland"]
debug = ["egui_plot"]
xwayland = ["smithay/xwayland"]

[patch."https://github.com/Smithay/smithay.git"]
smithay = { git = "https://github.com/smithay//smithay" }
